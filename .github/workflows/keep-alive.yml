name: Keep Supabase Alive

on:
  schedule:
    # Executa a cada 12 horas (00:00 e 12:00 UTC)
    # Impede que o Supabase entre em hibernação ou pause por inatividade de 7 dias
    - cron: '0 */12 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub

jobs:
  ping:
    name: Ping Database & Application
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Next.js App Cron Endpoint
        run: |
          echo "Pinging Vercel Cron Endpoint..."
          APP_PING_URL="https://santa-cifra.vercel.app/api/cron/ping?secret=santacifra"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "$APP_PING_URL" || echo "000")
          echo "App Cron Ping Status: $STATUS"

      - name: Ping App Health Check
        run: |
          echo "Pinging Health Check..."
          HEALTH_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 "https://santa-cifra.vercel.app/api/health" || echo "000")
          echo "Health Check Status: $HEALTH_STATUS"

      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase REST API..."
          
          SUPA_URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$SUPA_URL" ]; then
            SUPA_URL="https://lbpqmymptrgmuijcotwy.supabase.co"
          fi

          ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -n "$ANON_KEY" ]; then
            AUTH_HEADER="-H \"apikey: $ANON_KEY\" -H \"Authorization: Bearer $ANON_KEY\""
          else
            AUTH_HEADER=""
          fi

          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 30 \
            --location \
            $AUTH_HEADER \
            "${SUPA_URL}/rest/v1/" || echo "000")
          
          echo "Supabase REST Status: $HTTP_STATUS"
          echo "✅ Keep-alive executado com sucesso!"
